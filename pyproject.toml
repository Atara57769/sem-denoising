[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-denoising"
version = "0.1.0"
description = "Research-grade benchmarking pipeline for SEM image denoising with classical and learned neural architectures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-image>=0.20.0",
    "opencv-python>=4.7.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
sem-train = "sem_denoising.cli_train:main"
sem-benchmark = "sem_denoising.cli_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

